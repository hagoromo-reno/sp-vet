version: "3.7"

services:
  anest_vet:
    # Imagem construída e publicada automaticamente via GitHub Actions no GHCR
    image: ghcr.io/hagoromo-reno/sp-vet:latest
    healthcheck:
      disable: true
    networks:
      - PetSoftNet
    environment:
      - PORT=3000
      - NODE_ENV=production

      # 1. Conexão para o dia a dia do app (via PgBouncer na porta 6432 com pool de conexões)
      - DATABASE_URL=postgresql://postgres:19dd7b730f9dd8a558ceb1d94dce7e8b@pgbouncer:6432/postgres?schema=public&pgbouncer=true

      # 2. Conexão direta para DDL/migrações automáticas de tabelas (direto no Postgres na porta 5432)
      - DIRECT_URL=postgresql://postgres:19dd7b730f9dd8a558ceb1d94dce7e8b@postgres:5432/postgres?schema=public

      # Parâmetros de segurança e sessão única
      - SESSION_SECRET=c29wZXQtc3AtdmV0LWV4Y2x1c2l2by0yMDI2

      # 3. Serviço de E-mail Transacional (AOL SMTP - Confirmação de E-mail e Ativação de Licença)
      - SMTP_HOST=smtp.aol.com
      - SMTP_PORT=587
      - SMTP_SECURE=false
      - SMTP_USER=arbor.br@aol.com
      - SMTP_PASS=doohwgckvsnxglhw
      - 'SMTP_FROM="ANEST-VET Simulador Veterinário" <arbor.br@aol.com>'

      # 4. Banco Asaas (Cobranças via Cartão, PIX e Boleto + Webhook de Efetivação)
      - ASAAS_API_URL=https://api.asaas.com/v3
      - ASAAS_API_KEY=${ASAAS_API_KEY}
      - ASAAS_WEBHOOK_TOKEN=${ASAAS_WEBHOOK_TOKEN}
      - LICENSE_PRICE_BRL=49.90
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: "1"
          memory: 1024M
      labels:
        - traefik.enable=true
        - traefik.http.routers.anest_vet.rule=Host(`anest.sopet.app`)
        - traefik.http.routers.anest_vet.entrypoints=websecure
        - traefik.http.routers.anest_vet.tls.certresolver=letsencryptresolver
        - traefik.http.routers.anest_vet.priority=1
        - traefik.http.routers.anest_vet.service=anest_vet
        - traefik.http.services.anest_vet.loadbalancer.server.port=3000
        - traefik.http.services.anest_vet.loadbalancer.passHostHeader=true
        - traefik.docker.network=PetSoftNet
    restart: unless-stopped

networks:
  PetSoftNet:
    external: true
    name: PetSoftNet
